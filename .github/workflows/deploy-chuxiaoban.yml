name: 构建并部署厨小伴
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deploy/chuxiaoban/**
      - frontend/public/shared/chuxiaoban/chuxiaoban-project-2026-10-29.zip
      - .github/workflows/deploy-chuxiaoban.yml
permissions:
  contents: read
concurrency:
  group: chuxiaoban-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 准备原始项目的部署副本
        run: python3 deploy/chuxiaoban/prepare-build.py /tmp/cxb-build frontend/public/shared/chuxiaoban/chuxiaoban-project-2026-10-29.zip
      - name: 测试并构建后端
        working-directory: /tmp/cxb-build/chuxiaoban/apps/server
        run: mvn -B test package
      - name: 构建 H5
        working-directory: /tmp/cxb-build/chuxiaoban/apps/web-mini
        env:
          VITE_API_BASE_URL: /chuxiaoban
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build:h5
      - name: 组装厨小伴部署包
        run: |
          mkdir -p /tmp/cxb-release/web
          cp /tmp/cxb-build/chuxiaoban/apps/server/target/chuxiaoban-server-0.1.0-SNAPSHOT.jar /tmp/cxb-release/server.jar
          cp -R /tmp/cxb-build/chuxiaoban/apps/web-mini/dist/build/h5/. /tmp/cxb-release/web/
          cp deploy/chuxiaoban/compose.yaml deploy/chuxiaoban/nginx.conf deploy/chuxiaoban/release.sh /tmp/cxb-release/
          tar -czf /tmp/cxb-release.tar.gz -C /tmp/cxb-release .
      - name: 发布独立服务
        env:
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          scp -o StrictHostKeyChecking=accept-new /tmp/cxb-release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cxb-${GITHUB_SHA}.tar.gz"
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "set -e; cd /opt/chuxiaoban; mkdir -p backups/${GITHUB_SHA}; cp -a web server.jar compose.yaml nginx.conf release.sh backups/${GITHUB_SHA}/; tar -xzf /tmp/cxb-${GITHUB_SHA}.tar.gz -C /opt/chuxiaoban; bash release.sh"
      - name: 验证公网入口与主站
        run: |
          for i in {1..30}; do
            if curl -fsS https://wynnyaleyox.me/chuxiaoban/ | grep -q '/chuxiaoban/assets/'; then break; fi
            sleep 5
          done
          curl -fsS https://wynnyaleyox.me/chuxiaoban/ | grep '/chuxiaoban/assets/'
          curl -fsS https://wynnyaleyox.me/api/public/profile >/dev/null
