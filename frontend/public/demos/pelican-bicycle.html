<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#5b4038;background:radial-gradient(circle at 10% 10%,#ffe2d8,transparent 30%),#fff7ed;font-family:Inter,"Microsoft YaHei",sans-serif}.wrap{width:min(1050px,100%)}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:16px}h1{margin:5px 0;font:clamp(34px,6vw,68px)/1 Georgia,serif}header small{color:#b36e61;letter-spacing:.18em}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar span{margin-right:auto;font-size:12px}.toolbar button,.scene>button{padding:9px 14px;border:1px solid #d7ad9d;border-radius:999px;color:#744f46;background:#fffaf4;cursor:pointer}.toolbar button.active,.scene>button{color:#fff;background:#aa695c;border-color:#aa695c}.scene{--sky1:#fbd7ca;--sky2:#fff3df;--road:#8e6a5e;--hill:#dca98d;--wing:#ecc6aa;position:relative;overflow:hidden;border:1px solid #deb9aa;border-radius:28px;box-shadow:0 24px 60px #73504426;cursor:pointer}.scene svg,.scene .generated{display:block;width:100%;height:auto}.scene .generated[hidden],.scene svg[hidden]{display:none}.playing .generated{animation:generatedRide 1.1s ease-in-out infinite alternate}.bike{fill:none;stroke:#57443d;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}.wheel{fill:#ffffff20;stroke-dasharray:12 7;transform-box:fill-box;transform-origin:center}.leg{fill:none;stroke:#d7a27f;stroke-width:16;stroke-linecap:round}.status{position:absolute;left:18px;top:16px;padding:9px 12px;border-radius:14px;background:#fffaf3d9}.status b{display:block;font:17px Georgia,serif}.status span{font-size:10px}.scene>button{position:absolute;right:18px;bottom:16px}.playing .wheel{animation:spin .72s linear infinite}.playing .wing{transform-box:fill-box;transform-origin:20% 50%;animation:flap .55s ease-in-out infinite alternate}.playing .obstacle{animation:road 4.2s linear infinite}.playing .second{animation-delay:-2.1s}.jump .rider{animation:jump .62s ease-in-out}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flap{to{transform:rotate(-13deg)}}@keyframes road{to{transform:translateX(-1260px)}}@keyframes jump{50%{transform:translateY(-115px) rotate(-2deg)}}@keyframes generatedRide{to{transform:translateY(-4px) scale(1.006)}}@media(max-width:650px){body{padding:13px}.status span{display:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div><small>SVG · CSS · INTERACTION</small><h1>鹈鹕骑自行车</h1></div></header>
    <div class="toolbar"><span>选择画面</span><button class="active" data-art="local">本地 SVG</button><button data-art="qwen">Qwen 3.8 Max</button></div>
    <section class="scene" aria-label="鹈鹕骑自行车的二维动画">
      <img class="generated" src="/media/game-art/pelican-qwen.svg" alt="Qwen 3.8 Max 生成的鹈鹕骑行插画" hidden>
      <svg viewBox="0 0 1000 520" role="img">
        <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky1)"/><stop offset="1" stop-color="var(--sky2)"/></linearGradient></defs>
        <rect width="1000" height="520" fill="url(#sky)"/><circle cx="830" cy="90" r="45" fill="#ffc67f" opacity=".78"/><g fill="#fff8ef"><ellipse cx="120" cy="105" rx="72" ry="25"/><ellipse cx="185" cy="104" rx="46" ry="19"/><ellipse cx="610" cy="72" rx="62" ry="22"/></g><path d="M0 340 Q170 265 340 340 T680 334 T1000 330 V520 H0Z" fill="var(--hill)"/><rect y="388" width="1000" height="132" fill="var(--road)"/><path d="M0 449 H1000" stroke="#f5d7be" stroke-width="8" stroke-dasharray="48 35"/>
        <g class="obstacle"><rect x="930" y="338" width="28" height="50" rx="7" fill="#a96555"/><circle cx="944" cy="329" r="24" fill="#d99875"/></g><g class="obstacle second"><rect x="1160" y="348" width="24" height="40" rx="6" fill="#927060"/><circle cx="1172" cy="340" r="20" fill="#e1ad87"/></g>
        <g class="rider"><g class="bike"><circle class="wheel" cx="385" cy="385" r="76"/><circle class="wheel" cx="615" cy="385" r="76"/><path d="M385 385 472 282 535 385 430 385 493 318 615 385 M472 282 568 282 M535 385 566 273"/><circle cx="535" cy="385" r="11"/></g><g><ellipse cx="492" cy="230" rx="92" ry="71" fill="#fff8e9"/><path class="wing" d="M440 220 Q490 165 555 226 Q505 282 447 257Z" fill="var(--wing)"/><circle cx="565" cy="169" r="49" fill="#fff8e9"/><circle cx="581" cy="157" r="6" fill="#3f332e"/><path d="M599 173 720 196 600 213 Q616 193 599 173Z" fill="#e98b5e"/><path d="M552 208 Q604 234 638 206 Q621 260 558 244Z" fill="#f4c9a4"/><path class="leg" d="M470 278 500 326 535 385 M515 278 553 332 570 357"/></g></g>
      </svg>
      <div class="status"><b>本地 SVG</b><span>点击画面或按空格跳跃</span></div><button type="button">开始骑行</button>
    </section>
  </main>
  <script>
    const scene=document.querySelector('.scene'),start=document.querySelector('.scene>button'),label=document.querySelector('.status b');let playing=false,jumping=false;
    function toggle(){playing=!playing;scene.classList.toggle('playing',playing);start.textContent=playing?'暂停骑行':'开始骑行'}
    function jump(){if(!playing)return toggle();if(jumping)return;jumping=true;scene.classList.add('jump');setTimeout(()=>{scene.classList.remove('jump');jumping=false},620)}
    scene.addEventListener('click',jump);start.addEventListener('click',event=>{event.stopPropagation();toggle()});addEventListener('keydown',event=>{if(event.code==='Space'||event.code==='ArrowUp'){event.preventDefault();jump()}});
    const localArt=scene.querySelector('svg'),generatedArt=scene.querySelector('.generated');document.querySelectorAll('.toolbar button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.toolbar button').forEach(item=>item.classList.remove('active'));button.classList.add('active');const generated=button.dataset.art==='qwen';localArt.hidden=generated;generatedArt.hidden=!generated;label.textContent=button.textContent}));
  </script>
</body>
</html>
