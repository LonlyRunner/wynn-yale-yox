server {
  listen 80;
  server_name wynnyaleyox.me www.wynnyaleyox.me;
  return 301 https://wynnyaleyox.me$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name wynnyaleyox.me www.wynnyaleyox.me;
  ssl_certificate /etc/letsencrypt/live/wynnyaleyox.me/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wynnyaleyox.me/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;
  location /api/ {
    proxy_pass http://host.docker.internal:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css|png|jpg|jpeg|webp|mp4)$ { expires 7d; add_header Cache-Control "public"; }
}
