server {
  listen 80;
  server_name wynnyaleyox.me www.wynnyaleyox.me;
  return 301 https://wynnyaleyox.me$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name wynnyaleyox.me www.wynnyaleyox.me;
  ssl_certificate /etc/letsencrypt/live/wynnyaleyox.me/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wynnyaleyox.me/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;
  location /api/ {
    proxy_pass http://host.docker.internal:8080/api/;
    proxy_connect_timeout 3s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @backend_unavailable;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location @backend_unavailable {
    default_type application/json;
    add_header Retry-After 5 always;
    return 503 '{"message":"服务正在更新，请稍后重试"}';
  }
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /index.html =404;
  }
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
  location ~* ^/assets/.*\.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location ~* \.(png|jpg|jpeg|webp|mp4)$ { expires 7d; add_header Cache-Control "public"; }
}
