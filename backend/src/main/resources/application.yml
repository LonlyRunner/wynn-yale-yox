server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/wynn;MODE=MySQL;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    model:
      chat: none
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  admin:
    username: ${ADMIN_USERNAME:wynn}
    password: ${ADMIN_PASSWORD:change-me-before-production}
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  ai:
    qwen:
      base-url: ${QWEN_BASE_URL:}
      api-key: ${QWEN_API_KEY:}
      image-model: ${QWEN_IMAGE_MODEL:qwen-image-3.0}
      vision-model: ${QWEN_VISION_MODEL:qwen3-vl-flash}
    relay:
      base-url: ${RELAY_BASE_URL:}
      api-key: ${RELAY_API_KEY:}
      image-model: ${RELAY_IMAGE_MODEL:grok-imagine-image-2.0}
      video-model: ${RELAY_VIDEO_MODEL:grok-imagine-video-1.5}
    chat:
      deepseek:
        base-url: ${DEEPSEEK_BASE_URL:${QWEN_BASE_URL:}}
        api-key: ${DEEPSEEK_API_KEY:${QWEN_API_KEY:}}
        model: ${DEEPSEEK_CHAT_MODEL:deepseek-v3.2}
      qwen:
        base-url: ${QWEN_BASE_URL:}
        api-key: ${QWEN_API_KEY:}
        model: ${QWEN_CHAT_MODEL:qwen-plus}
      relay:
        base-url: ${CHAT_RELAY_BASE_URL:${RELAY_BASE_URL:}}
        api-key: ${CHAT_RELAY_API_KEY:}
        models: ${CHAT_RELAY_MODELS:deepseek-v4-flash,deepseek-v4.1-flash,glm-5.3-flash,glm-5.2,qwen3.8-max}
      secondary-relay:
        base-url: ${CHAT_SECONDARY_RELAY_BASE_URL:${CHAT_RELAY_BASE_URL:${RELAY_BASE_URL:}}}
        api-key: ${CHAT_SECONDARY_RELAY_API_KEY:}
        models: ${CHAT_SECONDARY_RELAY_MODELS:gpt-5.5,gpt-5.6,gpt-5.6-sol,gpt-5.6-terra,gpt-6-astra}
