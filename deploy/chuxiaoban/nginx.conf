limit_req_zone $binary_remote_addr zone=cxb_requests:2m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=cxb_connections:2m;
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 11m;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Real-IP;
  location = /api/v1/auth/account/login {
    default_type application/json;
    return 503 '{"code":"LOGIN_NOT_CONFIGURED","message":"正式登录尚未配置短信或微信身份验证，请使用游客模式","data":null}';
  }
  location = /api/v1/auth/account/link {
    default_type application/json;
    return 503 '{"code":"LOGIN_NOT_CONFIGURED","message":"正式账号绑定尚未配置，请使用游客模式","data":null}';
  }
  location /api/ {
    limit_req zone=cxb_requests burst=20 nodelay;
    limit_conn cxb_connections 4;
    limit_req_status 429;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/json;
    sub_filter_once off;
    sub_filter 'http://storage:9000/' 'https://wynnyaleyox.me/chuxiaoban/objects/';
  }
  location /objects/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://storage:9000/;
    proxy_set_header Host storage:9000;
    add_header Cache-Control "private, max-age=300";
  }
  location ~* ^/(?:actuator|swagger-ui|v3/api-docs) { return 404; }
  location ~* ^/assets/ { try_files $uri =404; expires 1d; }
  location / { add_header Cache-Control "no-cache" always; try_files $uri $uri/ /index.html; }
}
