name: chuxiaoban
services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:17-alpine
    restart: unless-stopped
    mem_limit: 192m
    environment:
      POSTGRES_DB: chuxiaoban
      POSTGRES_USER: chuxiaoban
      POSTGRES_PASSWORD: ${CXB_DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "work_mem=2MB"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chuxiaoban -d chuxiaoban"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: docker.m.daocloud.io/library/redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 64m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: ["redis-data:/data"]
  storage:
    image: chuxiaoban-minio:cached-14cea493
    pull_policy: never
    restart: unless-stopped
    mem_limit: 256m
    environment:
      MINIO_ROOT_USER: ${CXB_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${CXB_S3_SECRET_KEY}
      GOMEMLIMIT: 192MiB
      MINIO_API_REQUESTS_MAX: "4"
    command: server /data --console-address :9001
    volumes: ["storage-data:/data"]
  storage-init:
    image: chuxiaoban-mc:cached-a7fe349e
    pull_policy: never
    mem_limit: 64m
    depends_on: [storage]
    environment:
      MINIO_ROOT_USER: ${CXB_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${CXB_S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'for i in $$(seq 1 30); do mc alias set local http://storage:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc mb --ignore-existing local/chuxiaoban-private && exit 0; sleep 2; done; exit 1'
  backend:
    image: docker.m.daocloud.io/library/eclipse-temurin:21-jre-alpine
    restart: unless-stopped
    mem_limit: 448m
    working_dir: /app
    env_file: .env
    environment:
      CXB_DB_URL: jdbc:postgresql://postgres:5432/chuxiaoban
      CXB_DB_USERNAME: chuxiaoban
      CXB_REDIS_HOST: redis
      CXB_REDIS_PORT: "6379"
      CXB_S3_ENDPOINT: http://storage:9000
      CXB_S3_BUCKET: chuxiaoban-private
      CXB_SERVER_PORT: "8080"
      CXB_ALLOWED_ORIGINS: https://wynnyaleyox.me
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "8"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx224m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m -Xss256k -XX:+ExitOnOutOfMemoryError
    command: ["java", "-jar", "/app/server.jar"]
    volumes: ["./server.jar:/app/server.jar:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
  web:
    image: docker.m.daocloud.io/library/nginx:1.28-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports: ["${CXB_BRIDGE_IP}:18081:8080", "127.0.0.1:18081:8080"]
    volumes: ["./web:/usr/share/nginx/html:ro", "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [backend]
volumes:
  postgres-data:
  redis-data:
  storage-data:
