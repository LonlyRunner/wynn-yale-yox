services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --innodb-buffer-pool-size=256M --max-connections=40
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck: { test: ["CMD","mysqladmin","ping","-h","localhost"], interval: 10s, timeout: 5s, retries: 10 }
    ports: ["127.0.0.1:3306:3306"]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.runtime
    restart: unless-stopped
    depends_on: [mysql]
    ports: ["80:80", "443:443"]
    volumes: ["/etc/letsencrypt:/etc/letsencrypt:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    deploy: { resources: { limits: { memory: 96M } } }
volumes:
  mysql-data:
